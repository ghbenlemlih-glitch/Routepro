<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6B5B">
<title>RoutePro Commercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Mise en page : appli mobile plein écran — en-tête fin, vue active au centre, barre d'onglets en bas. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#F5F8F7; --ink:#14201C; --muted:#5A6A64; --line:#D7E0DC;
  --accent:#0D6B5B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA; --saffron:#B97D0E;
  --ok:#2F8A4E; --due:#CF7F14; --late:#C2432E; --never:#8B979C; --prospect:#6B54BF; --me:#1F6FE0;
  --shadow:0 8px 28px rgba(20,32,28,.14); --tile-filter:none;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --surface2:#1F2B27; --ink:#E6EEEB; --muted:#97A6A0; --line:#2C3934;
  --accent:#3DB39C; --accent-ink:#04201A; --accent-soft:#173B34; --saffron:#E3A63A;
  --ok:#52BA75; --due:#EAA043; --late:#E2674F; --never:#7F8C91; --prospect:#9C88F0; --me:#5B9BFF;
  --shadow:0 8px 28px rgba(0,0,0,.45); --tile-filter:brightness(.72) contrast(1.08) saturate(.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --surface2:#1F2B27; --ink:#E6EEEB; --muted:#97A6A0; --line:#2C3934;
  --accent:#3DB39C; --accent-ink:#04201A; --accent-soft:#173B34; --saffron:#E3A63A;
  --ok:#52BA75; --due:#EAA043; --late:#E2674F; --never:#7F8C91; --prospect:#9C88F0; --me:#5B9BFF;
  --shadow:0 8px 28px rgba(0,0,0,.45); --tile-filter:brightness(.72) contrast(1.08) saturate(.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column}

/* En-tête */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:700 19px/1 var(--f-display);letter-spacing:-.01em}
.brand b{color:var(--accent)}
.top .date{color:var(--muted);font-size:13px;margin-left:auto}
.gps{font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.gps.on{color:var(--me);border-color:color-mix(in srgb,var(--me) 40%,transparent)}

main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}

/* Onglets */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--late);color:#fff;font:600 10px/16px var(--f-body);min-width:16px;padding:0 4px;border-radius:8px}

/* Carte */
#map{position:absolute;inset:0;background:var(--surface2)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 var(--f-body);min-width:190px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:10px}
.pop-t{font-weight:600;font-size:15px}
.pop-s{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.pop-a{display:flex;gap:6px;flex-wrap:wrap}
.pin{width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--c);color:var(--ink);font:600 13px/22px var(--f-mono);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pin.done{background:var(--c);color:#fff}
.chrpin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.chrpin b{transform:rotate(45deg);color:#fff;font:700 12px var(--f-body)}
.mapbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mapbar select,.mapbar .btn{box-shadow:var(--shadow)}
.mapbar select{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600;font-size:14px}
.maptop{position:absolute;left:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.legend{background:var(--surface);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;display:grid;gap:3px}
.legend span{display:flex;align-items:center;gap:6px}
.place-banner{position:absolute;left:12px;right:12px;top:12px;z-index:600;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-weight:500}
.place-banner .btn{margin-left:auto}

/* Composants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:focus-visible,.tabs button:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.icon{width:34px;padding:0}
.btn.danger{color:var(--late)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3,.sec-h{font:700 15px/1.2 var(--f-display);margin:0 0 10px;letter-spacing:-.005em}
.sec-h{margin:4px 0 0;display:flex;align-items:baseline;gap:8px}
.sec-h small{font:500 12px var(--f-body);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.banner{background:color-mix(in srgb,var(--saffron) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--saffron) 35%,transparent);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.banner .btn{margin-left:auto}

/* Journée */
.daynav{display:flex;gap:8px;align-items:center}
.daynav input{flex:1;min-width:0;min-height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;min-width:0}
.kpi .v{font:500 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stop .n{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;font:600 13px var(--f-mono)}
.stop.done .n{background:var(--c);color:#fff}
.stop .who{min-width:0}
.stop .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .side{display:flex;gap:4px;align-items:center}
.stop .acts{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:26px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font:700 16px var(--f-display);margin-bottom:4px}

/* Clients */
.search{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .num{opacity:.75;margin-left:3px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600}
.row .meta{font-size:12.5px;color:var(--muted)}
.row .r{text-align:right;font-size:12px;color:var(--muted)}

/* Stats */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:var(--c)}
.bar .num{text-align:right}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;padding-top:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col i{width:100%;max-width:30px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.col span{font-size:11px;color:var(--muted)}
.col b{font:500 11px var(--f-mono)}
.inline-num{width:64px;min-height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);text-align:center}

/* Formulaires / feuilles */
.sheet-wrap{position:fixed;inset:0;z-index:2000;background:rgba(8,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:var(--shadow)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:700 20px/1.2 var(--f-display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);padding:10px 12px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locstat{font-size:12.5px;font-weight:600}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.results{display:flex;gap:6px;flex-wrap:wrap}
.results button{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.results button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{border-left:3px solid var(--c);padding:2px 0 2px 10px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
.pick{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.pick label{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:3000;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
table.prev{border-collapse:collapse;font-size:12.5px;width:100%}
table.prev th,table.prev td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.scrollx{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
/* Déplacement */
.tripcta{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.tripcta b{display:block;font:700 15px var(--f-display)}
.tripcta span{font-size:12.5px;color:var(--muted)}
.chip.city[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
.chipwrap{display:flex;gap:6px;flex-wrap:wrap}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-h{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);border-top:4px solid var(--dc);flex-wrap:wrap}
.day-h b{font:700 16px var(--f-display)}
.day-h .meta{margin-left:auto;font-size:12.5px;color:var(--muted)}
.leg{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:9px 14px;border-bottom:1px dashed var(--line)}
.leg:last-of-type{border-bottom:0}
.leg .h{font:500 14px var(--f-mono);color:var(--dc)}
.leg .nm{font-weight:600}
.leg .d{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.leg.end .h,.leg.start .h{color:var(--muted)}
.day-f{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--surface2);border-top:1px solid var(--line)}
.warn{color:var(--late);font-weight:600}
.mini{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.mini div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line)}
.mini div:last-child{border-bottom:0}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}.bar{grid-template-columns:82px 1fr 30px}}
.lock{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock h1{font:700 28px/1.1 var(--f-display);margin:0}.lock h1 b{color:var(--accent)}
.lock input{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:center;font:500 26px var(--f-mono);letter-spacing:.3em}
.lock .err{color:var(--late);font-weight:600;min-height:20px;font-size:14px}
input,select,textarea{font-size:16px!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="lock" id="lock"><form id="lockForm" autocomplete="off"><h1>Route<b>Pro</b></h1><p class="muted" style="margin:0">Entre ton code d'accès</p><input id="lockIn" type="password" inputmode="numeric" maxlength="12" aria-label="Code d'accès" autofocus><div class="err" id="lockErr"></div><button class="btn pri block" type="submit">Ouvrir</button></form></div>
<div class="app">
  <header class="top">
    <div class="brand">Route<b>Pro</b></div>
    <span class="date" id="hdrDate"></span>
    <button class="gps" id="gpsChip" data-act="locate" aria-label="Me localiser">GPS —</button>
  </header>

  <main>
    <section class="view" id="v-carte">
      <div id="map"></div>
      <div class="maptop" id="mapTop">
        <button class="btn sm" data-act="toggleLegend">Légende</button>
        <div class="legend" id="legend" hidden></div>
        <button class="btn sm" data-act="tHide" id="tripHide" hidden>Masquer le déplacement</button>
      </div>
      <div class="place-banner" id="placeBanner" hidden><span id="placeText">Touche la carte</span><button class="btn sm" data-act="cancelPlace">Annuler</button></div>
      <div class="mapbar">
        <button class="btn pri" data-act="locate">Ma position</button>
        <select id="chrType" aria-label="Catégorie">
          <option value="hotel">Hôtels</option>
          <option value="restaurant">Restaurants</option>
          <option value="cafe">Cafés</option>
          <option value="bar">Bars</option>
          <option value="all">Tout CHR</option>
        </select>
        <select id="chrRadius" aria-label="Rayon">
          <option value="500">500 m</option>
          <option value="1000" selected>1 km</option>
          <option value="2000">2 km</option>
          <option value="5000">5 km</option>
        </select>
        <button class="btn" data-act="chrSearch">Chercher ici</button>
        <button class="btn" data-act="chrList" id="chrListBtn" hidden>Liste</button><button class="btn icon" data-act="chrClear" id="chrClear" hidden aria-label="Effacer les résultats">✕</button>
      </div>
    </section>

    <section class="view" id="v-jour" hidden><div class="pad" id="jourBody"></div></section>
    <section class="view" id="v-clients" hidden>
      <div class="pad">
        <div class="btns" style="flex-wrap:nowrap">
          <input class="search" id="cliSearch" type="search" placeholder="Rechercher nom, ville, activité…" autocomplete="off">
          <button class="btn pri" style="flex:none" data-act="newClient">+ Client</button>
        </div>
        <div class="chips" id="cliChips"></div>
        <div id="cliList"></div>
      </div>
    </section>
    <section class="view" id="v-stats" hidden><div class="pad" id="statsBody"></div></section>
    <section class="view" id="v-plus" hidden><div class="pad" id="plusBody"></div></section>
    <section class="view" id="v-trip" hidden><div class="pad" id="tripBody"></div></section>
  </main>

  <nav class="tabs" aria-label="Navigation">
    <button data-tab="carte" aria-current="true"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Carte</button>
    <button data-tab="jour"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Journée<span class="badge" id="badgeJour" hidden></span></button>
    <button data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Clients</button>

</div>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileImport" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";
const APP_VERSION='2026-10-10c';
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return dstr(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fmtD=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fmtDL=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtDS=s=>s?new Date(s+'T12:00').toLocaleDateString('fr-FR'):'';
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function hav(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const fmtDur=m=>m==null?'—':(m>=60?Math.floor(m/60)+'h'+pad(Math.round(m%60)):Math.round(m)+' min');
const hasPos=c=>c&&Number.isFinite(+c.lat)&&Number.isFinite(+c.lng)&&c.lat!==''&&c.lat!==null;

/* ---------- données ---------- */
const KEY='routepro_v2';
let storageOK=true;
function blank(){return{clients:[],visites:[],tournees:{},settings:{freq:14,seuil:30,depart:null},seeded:false}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false;toast("Impossible d'enregistrer : le stockage du navigateur est indisponible.")}}
let S=load()||blank();
S.settings=Object.assign({freq:14,seuil:30,depart:null},S.settings||{});
const byId=id=>S.clients.find(c=>c.id===id);

const RES=[['commande','Commande','--ok'],['interesse','Intéressé','--accent'],['relancer','À relancer','--due'],['absent','Absent','--never'],['refus','Refus','--late']];
const resLabel=k=>(RES.find(r=>r[0]===k)||[,'—'])[1];
const resColor=k=>'var('+((RES.find(r=>r[0]===k)||[,,'--muted'])[2])+')';
const ST={late:['En retard','--late'],due:['À voir','--due'],never:['Jamais visité','--never'],prospect:['Prospect','--prospect'],ok:['À jour','--ok']};
const ST_ORDER=['late','due','never','prospect','ok'];
const ACTS=['Grossiste','Supérette','Épicerie','Café','Restaurant','Hôtel','Pharmacie','Boulangerie','Distributeur','Snack','Boucherie','Quincaillerie'];

let IDX={last:{},by:{}};
function buildIndex(){IDX={last:{},by:{}};for(const v of S.visites){(IDX.by[v.clientId]??=[]).push(v);if(!IDX.last[v.clientId]||v.dt>IDX.last[v.clientId])IDX.last[v.clientId]=v.dt}for(const k in IDX.by)IDX.by[k].sort((a,b)=>b.dt.localeCompare(a.dt))}
function lastBefore(id,ref){const l=IDX.by[id];if(!l)return null;const v=l.find(v=>v.dt.slice(0,10)<=ref);return v?v.dt:null}
function status(c,ref=today()){
  if(c.relance&&c.relance<=ref)return'due';
  const lv=lastBefore(c.id,ref);
  if(!lv)return c.prospect?'prospect':'never';
  const d=daysBetween(lv.slice(0,10),ref),f=+c.freq||S.settings.freq;
  if(d>f)return'late';if(d>=f*.8)return'due';return'ok';
}
const stColor=s=>'var('+ST[s][1]+')';
const sinceTxt=c=>{const lv=IDX.last[c.id];if(!lv)return'Jamais visité';const d=daysBetween(lv.slice(0,10),today());return d===0?"Vu aujourd'hui":d===1?'Vu hier':'Vu il y a '+d+' j'};
const doneOn=(id,date)=>(IDX.by[id]||[]).find(v=>v.dt.startsWith(date));
function tour(date,create){if(!S.tournees[date]&&create)S.tournees[date]={ids:[]};return S.tournees[date]||{ids:[]}}

/* ---------- interface générale ---------- */
let cur='carte',dayDate=today(),statsPeriod='30',cliFilter='tous',myPos=null,placing=null;
let toastT;
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
function show(v){cur=v;for(const s of $$('.view'))s.hidden=s.id!=='v-'+v;for(const b of $$('.tabs button'))b.setAttribute('aria-current',b.dataset.tab===v?'true':'false');if(v==='carte')setTimeout(()=>map.invalidateSize(),30);renderAll()}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheetWrap').hidden=false;$('#sheet').scrollTop=0}
function closeSheet(){$('#sheetWrap').hidden=true;$('#sheet').innerHTML=''}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
let confirmFn=null;
function askConfirm(title,msg,ok,fn,danger=true){confirmFn=fn;openSheet(`<h2>${esc(title)}</h2><p class="muted">${esc(msg)}</p><div class="btns" style="margin-top:14px"><button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn ${danger?'pri':'pri'}" data-act="confirmOk" style="${danger?'background:var(--late);border-color:var(--late);color:#fff':''}">${esc(ok)}</button></div>`)}

function renderAll(){buildIndex();renderMarkers();renderHeader();if(cur==='jour')renderDay();if(cur==='clients')renderClients();if(cur==='stats')renderStats();if(cur==='plus')renderPlus();if(cur==='trip')renderTrip()}
function renderHeader(){
  $('#hdrDate').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const t=tour(today()),rest=t.ids.filter(id=>byId(id)&&!doneOn(id,today())).length;
  const b=$('#badgeJour');b.hidden=!rest;b.textContent=rest;
}

/* ---------- carte ---------- */
const map=L.map('map',{zoomControl:false}).setView([33.5731,-7.5898],12);
/* fonds de carte : OpenStreetMap, puis CARTO en secours ; message clair si aucun ne charge */
const TILES=[['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap'],['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png','© OpenStreetMap © CARTO']];
let tileIdx=0,tileOk=false,tileErr=0,tileLayer=null;
function setTiles(i){if(tileLayer)map.removeLayer(tileLayer);tileErr=0;tileLayer=L.tileLayer(TILES[i][0],{maxZoom:19,subdomains:'abcd',attribution:TILES[i][1]});
  tileLayer.on('tileload',()=>{if(!tileOk){tileOk=true;netBanner()}});
  tileLayer.on('tileerror',()=>{if(tileOk)return;if(++tileErr>=4){if(tileIdx<TILES.length-1)setTiles(++tileIdx);else netBanner(true)}});tileLayer.addTo(map)}
setTiles(0);
setTimeout(()=>{if(!tileOk)netBanner(true)},9000);
function netBanner(fail){let b=document.getElementById('netBanner');
  if(!fail){if(b)b.remove();return}
  if(b)return;b=document.createElement('div');b.id='netBanner';b.className='place-banner';b.style.cssText='top:auto;bottom:70px;flex-direction:column;align-items:flex-start;gap:6px';
  const local=location.protocol==='file:'||location.protocol==='blob:'||location.protocol==='data:'||!/^https?:$/.test(location.protocol);
  b.innerHTML='<b>La carte ne peut pas se charger</b><span style="font-weight:400;font-size:13px">'+(local?'Le fichier est ouvert directement depuis le téléphone ou un aperçu. Ce mode bloque la carte et le calcul des routes. Ouvre l’appli depuis son lien https (tiiny.host, Netlify…).':'Pas d’accès aux serveurs de carte. Vérifie la connexion internet. Si tu ouvres le fichier depuis WhatsApp, Drive ou l’aperçu de Claude, ouvre plutôt ton lien https dans Chrome ou Safari.')+'</span><button class="btn sm" style="margin-left:0">Fermer</button>';
  b.querySelector('button').onclick=()=>b.remove();document.getElementById('v-carte').appendChild(b)}
L.control.zoom({position:'topright'}).addTo(map);
const clientLayer=L.layerGroup().addTo(map),routeLayer=L.layerGroup().addTo(map),chrLayer=L.layerGroup().addTo(map),meLayer=L.layerGroup().addTo(map);
const routeGeom={};
let fitted=false;
$('#legend').innerHTML=ST_ORDER.map(s=>`<span><i class="dot" style="--c:${stColor(s)}"></i>${ST[s][0]}</span>`).join('')+`<span><i class="dot" style="--c:var(--me)"></i>Ma position</span><span class="muted">Numéros : tournée du jour affiché</span>`;
function popupHtml(c){const s=status(c);return`<div class="pop-t">${esc(c.nom)}</div><div class="pop-s">${esc([c.activite,c.ville].filter(Boolean).join(' · '))}<br><span class="pill" style="--c:${stColor(s)}">${ST[s][0]}</span> ${esc(sinceTxt(c))}</div><div class="pop-a"><button class="btn sm pri" data-act="detail" data-id="${c.id}">Fiche</button><button class="btn sm" data-act="visit" data-id="${c.id}">Visite</button><a class="btn sm" href="${gmDir(c)}" target="_blank" rel="noopener">Itinéraire</a></div>`}
function renderMarkers(){
  clientLayer.clearLayers();
  const t=tour(dayDate),pts=[];
  for(const c of S.clients){if(!hasPos(c))continue;const s=status(c),col=getComputedStyle(document.documentElement).getPropertyValue(ST[s][1]).trim();const i=t.ids.indexOf(c.id);let m;
    if(i>=0){const done=!!doneOn(c.id,dayDate);m=L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:`<div class="pin${done?' done':''}" style="--c:${col}">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:500})}
    else m=L.circleMarker([c.lat,c.lng],{radius:8,color:'#fff',weight:2,fillColor:col,fillOpacity:1});
    m.bindPopup(()=>popupHtml(c));m.addTo(clientLayer);pts.push([c.lat,c.lng])}
  drawRoute();
  if(!fitted&&pts.length&&cur==='carte'){fitted=true;map.fitBounds(pts,{padding:[40,40],maxZoom:14})}
}
function drawRoute(){routeLayer.clearLayers();const t=tour(dayDate);const g=routeGeom[dayDate];
  const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  if(g)L.polyline(g,{color:col,weight:5,opacity:.85}).addTo(routeLayer);
  else{const pts=t.ids.map(byId).filter(hasPos).map(c=>[c.lat,c.lng]);if(pts.length>1)L.polyline(pts,{color:col,weight:3,opacity:.7,dashArray:'6 8'}).addTo(routeLayer)}}
function setMe(lat,lng,acc,manual){myPos={lat,lng,acc,manual};meLayer.clearLayers();const col=getComputedStyle(document.documentElement).getPropertyValue('--me').trim();
  if(acc)L.circle([lat,lng],{radius:acc,color:col,weight:1,fillOpacity:.08}).addTo(meLayer);
  L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:col,fillOpacity:1}).addTo(meLayer);
  const g=$('#gpsChip');g.classList.add('on');g.textContent=manual?'Position manuelle':acc?'GPS ±'+Math.round(acc)+' m':'GPS'}
function locate(cb,silent){
  if(!navigator.geolocation){if(!silent)toast('Ce navigateur ne donne pas accès au GPS.');cb&&cb(null);return}
  navigator.geolocation.getCurrentPosition(p=>{setMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy,false);cb&&cb(myPos)},err=>{
    if(!silent){const insecure=location.protocol!=='https:'&&!/^(localhost|127\.)/.test(location.hostname);
      toast(insecure?"Le GPS exige une adresse https. Héberge le fichier (voir l'onglet Données) ou touche la carte pour placer ta position.":err.code===1?'Position refusée. Autorise la localisation pour ce site dans les réglages du navigateur.':'Position indisponible pour le moment. Réessaie ou place-la sur la carte.',5500)}
    cb&&cb(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function startPlacing(p,text){placing=p;$('#placeText').textContent=text;$('#placeBanner').hidden=false;closeSheet();if(cur!=='carte')show('carte');
  const c=p.draft&&hasPos(p.draft)?[p.draft.lat,p.draft.lng]:myPos?[myPos.lat,myPos.lng]:null;if(c)map.setView(c,16)}
map.on('click',e=>{if(!placing)return;const {lat,lng}=e.latlng,p=placing;placing=null;$('#placeBanner').hidden=true;
  if(p.type==='me'){setMe(lat,lng,null,true);toast('Position définie manuellement')}
  else if(p.type==='tripDepart'){setTripDepart(lat,lng,'Point placé sur la carte');show('trip')}
  else if(p.type==='depart'){S.settings.depart={lat,lng};save();toast('Point de départ enregistré');show('plus')}
  else if(p.type==='client'){p.draft.lat=+lat.toFixed(6);p.draft.lng=+lng.toFixed(6);p.draft._src='Placé sur la carte';openClientForm(p.draft,p.back)}});

/* ---------- recherche CHR (OpenStreetMap / Overpass) ---------- */
const CHR={hotel:['nwr["tourism"~"^(hotel|guest_house|hostel|motel)$"]'],restaurant:['nwr["amenity"~"^(restaurant|fast_food)$"]'],cafe:['nwr["amenity"="cafe"]'],bar:['nwr["amenity"~"^(bar|pub)$"]']};
CHR.all=[...CHR.hotel,...CHR.restaurant,...CHR.cafe,...CHR.bar];
const CHR_LBL={hotel:'Hôtel',guest_house:"Maison d'hôtes",hostel:'Auberge',motel:'Motel',restaurant:'Restaurant',fast_food:'Snack',cafe:'Café',bar:'Bar',pub:'Bar'};
let chrData={},chrMk={},chrCenter=null;
/* serveurs OpenStreetMap (Overpass) : le principal est souvent saturé, on essaie les miroirs */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function overpass(q){let last;
  for(const u of OVERPASS){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),20000);
    const res=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});clearTimeout(tm);
    if(!res.ok){last=res.status;continue}return await res.json()}catch(e){last=e}}
  throw last||new Error('overpass')}
async function chrSearch(){
  if(map.getZoom()<12){if(myPos){map.setView([myPos.lat,myPos.lng],14)}else{toast('Zoome d’abord sur la ville où tu veux chercher, puis touche « Chercher ici ».',4500);return}}
  const type=$('#chrType').value,r=+$('#chrRadius').value,c=map.getCenter();
  const q=`[out:json][timeout:25];(${CHR[type].map(s=>`${s}(around:${r},${c.lat.toFixed(5)},${c.lng.toFixed(5)});`).join('')});out center 250;`;
  toast('Recherche en cours…',8000);
  try{const js=await overpass(q);chrLayer.clearLayers();chrData={};chrMk={};chrCenter={lat:c.lat,lng:c.lng};let n=0;const pts=[[c.lat,c.lng]];
    const known=new Set(S.clients.map(c=>norm(c.nom)));
    const col=getComputedStyle(document.documentElement).getPropertyValue('--prospect').trim(),colOk=getComputedStyle(document.documentElement).getPropertyValue('--ok').trim();
    for(const el of js.elements){const lat=el.lat??el.center?.lat,lng=el.lon??el.center?.lon;if(lat==null)continue;const tg=el.tags||{};const nom=tg.name||tg['name:fr']||tg['name:ar'];if(!nom)continue;
      const k=tg.tourism||tg.amenity;const id='o'+el.id;chrData[id]={nom,act:CHR_LBL[k]||k,tel:tg.phone||tg['contact:phone']||'',adr:[tg['addr:street'],tg['addr:city']].filter(Boolean).join(', '),ville:tg['addr:city']||'',lat,lng};
      const isC=known.has(norm(nom));
      const letter={hotel:'H',guest_house:'H',hostel:'H',motel:'H',restaurant:'R',fast_food:'S',cafe:'C',bar:'B',pub:'B'}[k]||'•';chrData[id].isC=isC;chrData[id].d=hav(c,{lat,lng});pts.push([lat,lng]);
      chrMk[id]=L.marker([lat,lng],{icon:L.divIcon({className:'',html:`<div class="chrpin" style="--c:${isC?colOk:col}"><b>${letter}</b></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]}),zIndexOffset:1000}).bindPopup(`<div class="pop-t">${esc(nom)}</div><div class="pop-s">${esc(chrData[id].act)}${chrData[id].tel?' · '+esc(chrData[id].tel):''}${isC?'<br>Déjà dans tes clients':''}</div><div class="pop-a"><a class="btn sm pri" href="${navTo(lat,lng)}" target="_blank" rel="noopener">Itinéraire</a>${isC?'':`<button class="btn sm" data-act="chrAdd" data-id="${id}">+ Prospect</button>`}</div>`).addTo(chrLayer);n++}
    $('#chrClear').hidden=!n;$('#chrListBtn').hidden=!n;$('#chrListBtn').textContent='Liste ('+n+')';if(n)map.fitBounds(pts,{padding:[60,60],maxZoom:16});toast(n?n+' établissement(s) trouvé(s) dans un rayon de '+(r>=1000?r/1000+' km':r+' m'):'Aucun résultat ici. Élargis le rayon ou déplace la carte.')
  }catch(e){toast('Recherche indisponible : les 4 serveurs OpenStreetMap n’ont pas répondu. Vérifie ta connexion et réessaie dans une minute.',5500)}}

/* ---------- liens Google Maps ---------- */
const NAV={google:'Google Maps',waze:'Waze',apple:'Plans (Apple)'};
const navApp=()=>NAV[S.settings.nav]?S.settings.nav:'google';
function navTo(lat,lng,q){const a=navApp(),has=lat!=null&&lng!=null;
  if(a==='waze')return has?`https://waze.com/ul?ll=${lat},${lng}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(q||'')}&navigate=yes`;
  if(a==='apple')return has?`https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`:`https://maps.apple.com/?q=${encodeURIComponent(q||'')}`;
  return has?`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'')}
const gmDir=c=>hasPos(c)?navTo(c.lat,c.lng):navTo(null,null,[c.nom,c.adresse,c.ville].filter(Boolean).join(', '));
function gmTour(date){const rest=tour(date).ids.map(byId).filter(c=>hasPos(c)&&!doneOn(c.id,date));if(!rest.length)return null;if(navApp()!=='google')return{u:navTo(rest[0].lat,rest[0].lng),next:rest[0].nom,cut:false};const pts=rest.slice(0,4),dest=pts[pts.length-1],wp=pts.slice(0,-1);
  let u=`https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lng}&travelmode=driving`;if(myPos)u+=`&origin=${myPos.lat},${myPos.lng}`;if(wp.length)u+='&waypoints='+wp.map(c=>c.lat+','+c.lng).join('%7C');return{u,cut:rest.length>4}}

/* ---------- lecture d'une localisation collée ---------- */
function parseLoc(s){s=String(s||'').trim();if(!s)return null;try{s=decodeURIComponent(s)}catch(e){}
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/[?&](?:q|query|ll|destination|daddr|center)=(?:loc:)?(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/,/geo:(-?\d+\.\d+),(-?\d+\.\d+)/,/(-?\d{1,2}\.\d{3,})\s*[,; ]\s*(-?\d{1,3}\.\d{3,})/];
  for(const p of pats){const m=s.match(p);if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat,lng}}}
  if(/goo\.gl|maps\.app|g\.co\//.test(s))return{short:true};return{bad:true}}


/* calcul de route : serveur OSRM public, puis serveur OpenStreetMap Allemagne en secours */
const OSRM=['https://router.project-osrm.org/{svc}/v1/driving/','https://routing.openstreetmap.de/routed-car/{svc}/v1/driving/'];
async function osrm(svc,coords,qs,ms=15000){let last;
  for(const base of OSRM){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),ms);
    const r=await fetch(base.replace('{svc}',svc)+coords+'?'+qs,{signal:ctl.signal});clearTimeout(tm);const js=await r.json();if(js.code==='Ok')return js;last=js.code}catch(e){last=e}}
  throw last||new Error('osrm')}
/* ---------- optimisation de tournée ---------- */
function optimizeOrder(pts,start){
  const a=start?[start,...pts]:[...pts];if(a.length<3)return pts;
  const n=a.length,used=new Array(n).fill(false),path=[0];used[0]=true;
  for(let k=1;k<n;k++){const l=a[path[path.length-1]];let b=-1,bd=Infinity;for(let j=0;j<n;j++)if(!used[j]){const d=hav(l,a[j]);if(d<bd){bd=d;b=j}}path.push(b);used[b]=true}
  const D=(i,j)=>hav(a[path[i]],a[path[j]]);let imp=true,guard=0;
  while(imp&&guard++<200){imp=false;for(let i=1;i<n-1;i++)for(let k=i+1;k<n;k++){const after=k+1<n?D(i,k+1)-D(k,k+1):0;const delta=D(i-1,k)-D(i-1,i)+after;if(delta<-1e-9){path.splice(i,k-i+1,...path.slice(i,k+1).reverse());imp=true}}}
  const res=path.map(i=>a[i]);return start?res.slice(1):res}
function startPoint(){return myPos?{lat:myPos.lat,lng:myPos.lng}:S.settings.depart}
async function computeRoute(date){
  const t=tour(date,true),st=startPoint();const ptsC=t.ids.map(byId).filter(hasPos);
  const all=(st?[st]:[]).concat(ptsC.map(c=>({lat:+c.lat,lng:+c.lng})));
  if(all.length<2){t.km=null;t.min=null;delete routeGeom[date];return}
  let est=0;for(let i=1;i<all.length;i++)est+=hav(all[i-1],all[i]);
  try{
    const js=await osrm('route',all.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';'),'overview=full&geometries=geojson');const ro=js.routes[0];
    t.km=+(ro.distance/1000).toFixed(1);t.min=Math.round(ro.duration/60);t.est=false;routeGeom[date]=ro.geometry.coordinates.map(c=>[c[1],c[0]])}
  catch(e){t.km=+(est*1.3).toFixed(1);t.min=Math.round(est*1.3/30*60);t.est=true;delete routeGeom[date]}
  t.fromStart=!!st;save()}
async function optimize(){
  const t=tour(dayDate,true);const done=t.ids.filter(id=>doneOn(id,dayDate)),todo=t.ids.filter(id=>!doneOn(id,dayDate));
  const pos=todo.map(byId).filter(hasPos),nopos=todo.filter(id=>!hasPos(byId(id)));
  if(pos.length<2){toast('Il faut au moins 2 clients localisés à visiter pour optimiser.');return}
  const lastDone=done.map(byId).filter(hasPos).pop();const st=myPos?{lat:myPos.lat,lng:myPos.lng}:lastDone?{lat:+lastDone.lat,lng:+lastDone.lng}:S.settings.depart;
  const ord=optimizeOrder(pos.map(c=>({id:c.id,lat:+c.lat,lng:+c.lng})),st);
  t.ids=[...done,...ord.map(p=>p.id),...nopos];toast('Calcul de l’itinéraire…',8000);await computeRoute(dayDate);
  toast(`Tournée optimisée : ${t.km} km${t.est?' (estimation à vol d’oiseau)':''}, ${fmtDur(t.min)} de route`+(st?'':' — sans point de départ, active le GPS pour partir de ta position'));renderAll()}

function periodRange(p){const t=today();if(p==='7')return[addDays(t,-6),t,'7 derniers jours'];if(p==='30')return[addDays(t,-29),t,'30 derniers jours'];if(p==='mois')return[t.slice(0,8)+'01',t,new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'})];return['0000-01-01',t,'Depuis le début']}
function computeStats(p){const[from,to,label]=periodRange(p);const vs=S.visites.filter(v=>{const d=v.dt.slice(0,10);return d>=from&&d<=to});
  const seen=new Set(vs.map(v=>v.clientId)),actifs=S.clients.filter(c=>!c.prospect),days=new Set(vs.map(v=>v.dt.slice(0,10)));
  let km=0,kmEst=false;for(const[d,t]of Object.entries(S.tournees))if(d>=from&&d<=to&&t.km!=null){km+=t.km;if(t.est)kmEst=true}
  const res=RES.map(([k,l])=>[k,l,vs.filter(v=>v.res===k).length]);
  const wd=[0,0,0,0,0,0,0];for(const v of vs){const g=new Date(v.dt.slice(0,10)+'T12:00').getDay();wd[(g+6)%7]++}
  const seuil=S.settings.seuil;const oubli=actifs.map(c=>{const lv=IDX.last[c.id];return{c,d:lv?daysBetween(lv.slice(0,10),today()):Infinity}}).filter(x=>x.d>=seuil).sort((a,b)=>b.d-a.d);
  const act={};for(const v of vs){const c=byId(v.clientId);const a=(c&&c.activite)||'Non renseignée';act[a]=(act[a]||0)+1}
  const cov=actifs.length?Math.round(actifs.filter(c=>seen.has(c.id)).length/actifs.length*100):0;
  const newC=S.clients.filter(c=>c.createdAt&&c.createdAt>=from&&c.createdAt<=to).length;
  const rel=S.clients.filter(c=>c.relance&&c.relance<=today()).length;
  return{from,to,label,vs,seen:seen.size,days:days.size,km:+km.toFixed(1),kmEst,res,wd,oubli,act:Object.entries(act).sort((a,b)=>b[1]-a[1]).slice(0,6),cov,actifs:actifs.length,newC,rel,moy:days.size?(vs.length/days.size).toFixed(1):'0'}}
function renderStats(){const s=computeStats(statsPeriod);const maxR=Math.max(1,...s.res.map(r=>r[2])),maxW=Math.max(1,...s.wd),maxA=Math.max(1,...s.act.map(a=>a[1]));
  const taux=s.vs.length?Math.round(s.res.find(r=>r[0]==='commande')[2]/s.vs.length*100):0;
  $('#statsBody').innerHTML=demoBanner()+`<div class="seg">${[['7','7 jours'],['30','30 jours'],['mois','Ce mois'],['tout','Tout']].map(([k,l])=>`<button data-act="period" data-p="${k}" aria-pressed="${statsPeriod===k}">${l}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi"><div class="v">${s.vs.length}</div><div class="l">Visites</div></div><div class="kpi"><div class="v">${s.seen}</div><div class="l">Clients vus</div></div><div class="kpi"><div class="v">${s.cov}%</div><div class="l">Couverture</div></div><div class="kpi"><div class="v">${s.km}</div><div class="l">Km tournée${s.kmEst?' *':''}</div></div></div>
  <div class="kpis"><div class="kpi"><div class="v">${s.days}</div><div class="l">Jours terrain</div></div><div class="kpi"><div class="v">${s.moy}</div><div class="l">Visites / jour</div></div><div class="kpi"><div class="v">${taux}%</div><div class="l">Taux commande</div></div><div class="kpi"><div class="v">${s.rel}</div><div class="l">Relances dues</div></div></div>
  <p class="small muted" style="margin:-4px 0 0">Couverture = part de tes ${s.actifs} clients (hors prospects) vus sur la période. Km = somme des itinéraires calculés des journées${s.kmEst?' ; * contient des estimations à vol d’oiseau':''}.</p>
  <div class="card"><h3>Résultats des visites</h3><div class="bars">${s.res.map(([k,l,n])=>`<div class="bar" style="--c:${resColor(k)}"><span>${l}</span><div class="t"><i style="width:${n/maxR*100}%"></i></div><span class="num">${n}</span></div>`).join('')}</div></div>
  <div class="card"><h3>Visites par jour de semaine</h3><div class="cols">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((d,i)=>`<div class="col"><b>${s.wd[i]||''}</b><i style="height:${s.wd[i]/maxW*80}%"></i><span>${d}</span></div>`).join('')}</div></div>
  ${s.act.length?`<div class="card"><h3>Visites par activité</h3><div class="bars">${s.act.map(([a,n])=>`<div class="bar" style="--c:var(--accent)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a)}</span><div class="t"><i style="width:${n/maxA*100}%"></i></div><span class="num">${n}</span></div>`).join('')}</div></div>`:''}
  <div class="card"><h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">Non visités depuis <input class="inline-num num" type="number" id="seuilIn" min="1" max="365" value="${S.settings.seuil}"> jours · ${s.oubli.length}</h3>
  ${s.oubli.length?'<div class="hist">'+s.oubli.slice(0,15).map(({c,d})=>`<div class="btns" style="align-items:center;flex-wrap:nowrap"><div style="flex:1;min-width:0"><button class="btn sm" style="border:0;padding:0;min-height:0;background:none;font-weight:600" data-act="detail" data-id="${c.id}">${esc(c.nom)}</button><div class="small muted">${d===Infinity?'Jamais visité':d+' jours'}${c.ville?' · '+esc(c.ville):''}</div></div><button class="btn sm" style="flex:none" data-act="planToday" data-id="${c.id}">Planifier aujourd’hui</button></div>`).join('')+'</div>'+(s.oubli.length>15?`<p class="small muted">+ ${s.oubli.length-15} autre(s), visibles dans l’export Excel.</p>`:''):'<p class="small muted">Aucun client au-delà de ce seuil.</p>'}</div>
  <div class="btns"><button class="btn" data-act="exportXlsx">Exporter Excel</button><button class="btn pri" data-act="exportPdf">Rapport PDF (${esc(s.label)})</button></div>`;
  $('#seuilIn').onchange=e=>{S.settings.seuil=Math.max(1,+e.target.value||30);save();renderStats()}}

const COLS={nom:['nom','client','raisonsociale','name','enseigne','societe','etablissement','nomclient'],activite:['activite','type','categorie','secteur','typeclient'],contact:['contact','responsable','gerant','interlocuteur'],tel:['tel','telephone','phone','gsm','mobile','portable','numero','teléphone'],ville:['ville','city','localite','quartier'],adresse:['adresse','address','rue'],lat:['lat','latitude'],lng:['lng','lon','long','longitude'],loc:['localisation','lien','maps','gps','position','coordonnees','location','googlemaps'],freq:['frequence','freq','frequencejours'],notes:['notes','note','commentaire','commentaires','remarque','remarques']};
let pending=null;
function readImport(file){if(!window.XLSX){toast('Module Excel non chargé : vérifie la connexion.');return}const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});prepImport(rows)}catch(err){toast('Fichier illisible. Utilise un .xlsx ou un .csv avec une ligne d’en-têtes.',5000)}};r.readAsArrayBuffer(file)}
function prepImport(rows){if(!rows.length){toast('Le fichier ne contient aucune ligne.');return}
  const heads=Object.keys(rows[0]),map={};for(const h of heads){const n=norm(h);for(const[k,al]of Object.entries(COLS))if(!map[k]&&al.map(norm).includes(n))map[k]=h}
  if(!map.nom){openSheet(`<h2>Colonne « Nom » introuvable</h2><p class="muted">En-têtes lus : ${esc(heads.join(', '))}.</p><p class="muted">Renomme la colonne du nom du client en « Nom » (ou télécharge le modèle) puis réessaie.</p><button class="btn pri block" data-act="closeSheet">Compris</button>`);return}
  const items=[];for(const r of rows){const g=k=>map[k]?String(r[map[k]]).trim():'';const nom=g('nom');if(!nom)continue;let lat=null,lng=null;
    const la=parseFloat(g('lat').replace(',','.')),lo=parseFloat(g('lng').replace(',','.'));if(Number.isFinite(la)&&Number.isFinite(lo)){lat=la;lng=lo}else if(g('loc')){const p=parseLoc(g('loc'));if(p&&p.lat!=null){lat=p.lat;lng=p.lng}}
    items.push({nom,activite:g('activite'),contact:g('contact'),tel:g('tel'),ville:g('ville'),adresse:g('adresse'),lat,lng,freq:+g('freq')||S.settings.freq,notes:g('notes')})}
  const keyOf=c=>norm(c.nom)+'|'+norm(c.ville);const ex=new Map(S.clients.map(c=>[keyOf(c),c]));const dup=items.filter(i=>ex.has(keyOf(i))).length,withPos=items.filter(hasPos).length;
  pending={items,keyOf};
  openSheet(`<h2>Importer ${items.length} client(s)</h2><p class="small muted">Colonnes reconnues : ${Object.keys(map).map(k=>esc(map[k])+' → '+k).join(', ')}</p>
  <div class="kpis k3" style="margin:12px 0"><div class="kpi"><div class="v">${items.length}</div><div class="l">Lignes</div></div><div class="kpi"><div class="v">${withPos}</div><div class="l">Avec position</div></div><div class="kpi"><div class="v">${dup}</div><div class="l">Déjà présents</div></div></div>
  <div class="scrollx"><table class="prev"><thead><tr><th>Nom</th><th>Activité</th><th>Ville</th><th>Tél.</th><th>Position</th></tr></thead><tbody>${items.slice(0,6).map(i=>`<tr><td>${esc(i.nom)}</td><td>${esc(i.activite)}</td><td>${esc(i.ville)}</td><td>${esc(i.tel)}</td><td>${hasPos(i)?'✓':'—'}</td></tr>`).join('')}</tbody></table></div>
  ${items.length>6?`<p class="small muted">… et ${items.length-6} autre(s).</p>`:''}
  ${dup?`<label class="check" style="margin-top:12px"><input type="checkbox" id="imUpd" checked> Mettre à jour les ${dup} client(s) déjà présents (même nom et ville)</label>`:''}
  <label class="check" style="margin-top:8px"><input type="checkbox" id="imPros"> Importer comme prospects</label>
  ${items.length-withPos?`<p class="small muted">${items.length-withPos} client(s) sans position : tu pourras les localiser ensuite depuis leur fiche, ou par adresse dans l’onglet Données.</p>`:''}
  <div class="btns" style="margin-top:12px"><button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn pri" data-act="imGo">Importer</button></div>`)}
function doImport(){const upd=$('#imUpd')?$('#imUpd').checked:false,pros=$('#imPros').checked;const ex=new Map(S.clients.map(c=>[pending.keyOf(c),c]));let n=0,u=0,s=0;
  for(const i of pending.items){const c=ex.get(pending.keyOf(i));if(c){if(upd){for(const k in i)if(i[k]!==''&&i[k]!=null)c[k]=i[k];u++}else s++}else{S.clients.push({...i,id:uid(),createdAt:today(),prospect:pros});n++}}
  save();pending=null;closeSheet();toast(`${n} ajouté(s), ${u} mis à jour${s?', '+s+' ignoré(s)':''}`,4500);renderAll()}

let geoRunning=false;
async function geocodeAll(){const list=S.clients.filter(c=>!hasPos(c)&&(c.adresse||c.ville));if(!list.length){toast('Aucun client sans position avec une adresse ou une ville.');return}
  geoRunning=true;renderPlus();let ok=0;
  for(let i=0;i<list.length&&geoRunning;i++){const c=list[i];toast(`Localisation ${i+1}/${list.length} : ${c.nom}`,3000);
    try{const q=[c.adresse,c.ville].filter(Boolean).join(', ');const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ma&q='+encodeURIComponent(q),{headers:{'Accept-Language':'fr'}});const js=await r.json();
      if(js[0]){c.lat=+(+js[0].lat).toFixed(6);c.lng=+(+js[0].lon).toFixed(6);c.locApprox=true;ok++;save()}}catch(e){}
    await new Promise(r=>setTimeout(r,1100))}
  geoRunning=false;toast(`${ok}/${list.length} client(s) localisé(s). Positions approximatives : vérifie-les sur la carte.`,5500);renderAll()}

/* ---------- déplacement multi-villes ---------- */
const DAYCOL=['#0D6B5B','#C2432E','#6B54BF','#CF7F14','#1F6FE0','#2F8A4E','#B0408A','#5A6A64'];
const tripLayer=L.layerGroup().addTo(map);
let tripGeom={},tripBusy=false;
const toMin=s=>{const[h,m]=String(s||'0:0').split(':').map(Number);return h*60+(m||0)};
const fmtH=m=>{m=Math.round(m);const d=Math.floor(m/1440);m-=d*1440;return pad(Math.floor(m/60))+':'+pad(m%60)+(d?' (+'+d+' j)':'')};
const cityKey=c=>norm(c.ville)||'_';
function tripInit(){if(!S.trip)S.trip={depart:null,date:addDays(today(),1),hStart:'08:30',hEnd:'18:30',visitMin:30,noSunday:true,cities:null,excluded:[],added:[],plan:null};
  const t=S.trip;if(t.tol==null)t.tol=60;if(!t.depart){if(S.settings.depart)t.depart={...S.settings.depart,label:'Point de départ enregistré'};else if(myPos)t.depart={lat:myPos.lat,lng:myPos.lng,label:'Ma position'}}return t}
function setTripDepart(lat,lng,label){const t=tripInit();t.depart={lat:+lat,lng:+lng,label};staleTrip();save()}
function staleTrip(){if(S.trip&&S.trip.plan)S.trip.plan.stale=true}
function cityList(){const m=new Map();for(const c of S.clients){if(!hasPos(c))continue;const k=cityKey(c);if(!m.has(k))m.set(k,{k,name:c.ville||'Sans ville',n:0,lat:0,lng:0});const o=m.get(k);o.n++;o.lat+=+c.lat;o.lng+=+c.lng}
  return[...m.values()].map(o=>({...o,lat:o.lat/o.n,lng:o.lng/o.n})).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}
function tripClients(){const t=tripInit(),cs=new Set(t.cities||[]),ex=new Set(t.excluded),ad=new Set(t.added);
  return S.clients.filter(c=>hasPos(c)&&((cs.has(cityKey(c))&&!ex.has(c.id))||ad.has(c.id)))}
function nextWorkDay(d,noSun){let x=addDays(d,1);if(noSun&&new Date(x+'T12:00').getDay()===0)x=addDays(x,1);return x}
function firstDay(d,noSun){return noSun&&new Date(d+'T12:00').getDay()===0?addDays(d,1):d}

/* matrice des temps de route : OSRM, sinon estimation */
async function travelMatrix(pts){const n=pts.length;
  const est=()=>{const dur=[],dist=[];for(let i=0;i<n;i++){dur[i]=[];dist[i]=[];for(let j=0;j<n;j++){const d=i===j?0:hav(pts[i],pts[j])*1.3;dist[i][j]=d;dur[i][j]=d/(d<15?28:70)*60}}return{dur,dist,est:true}};
  if(n>100)return est();
  try{
    const js=await osrm('table',pts.map(p=>(+p.lng).toFixed(6)+','+(+p.lat).toFixed(6)).join(';'),'annotations=duration,distance',25000);const E=est();
    const dur=js.durations.map((row,i)=>row.map((v,j)=>v==null?E.dur[i][j]:v/60)),dist=js.distances.map((row,i)=>row.map((v,j)=>v==null?E.dist[i][j]:v/1000));
    return{dur,dist,est:false}}catch(e){return est()}}

/* circuit fermé optimal (plus proche voisin + 2-opt + déplacement de points) sur temps de route */
function closedTour(M){const n=M.dur.length;if(n<=2)return[...Array(n).keys()].slice(1);
  const c=(i,j)=>(M.dur[i][j]+M.dur[j][i])/2;
  const used=new Array(n).fill(false),p=[0];used[0]=true;
  for(let k=1;k<n;k++){const l=p[p.length-1];let b=-1,bd=Infinity;for(let j=1;j<n;j++)if(!used[j]&&c(l,j)<bd){bd=c(l,j);b=j}p.push(b);used[b]=true}
  p.push(0);let imp=true,g=0;
  while(imp&&g++<300){imp=false;
    for(let i=1;i<p.length-2;i++)for(let k=i+1;k<p.length-1;k++){const d=c(p[i-1],p[k])+c(p[i],p[k+1])-c(p[i-1],p[i])-c(p[k],p[k+1]);if(d<-1e-6){p.splice(i,k-i+1,...p.slice(i,k+1).reverse());imp=true}}
    for(let i=1;i<p.length-1;i++){const x=p[i],rem=c(p[i-1],x)+c(x,p[i+1])-c(p[i-1],p[i+1]);let best=0,bj=-1;
      for(let j=0;j<p.length-1;j++){if(j===i-1||j===i)continue;const add=c(p[j],x)+c(x,p[j+1])-c(p[j],p[j+1]);if(add-rem<best-1e-6){best=add-rem;bj=j}}
      if(bj>=0){p.splice(i,1);const at=bj<i?bj+1:bj;p.splice(at,0,x);imp=true}}}
  return p.slice(1,-1)}

/* découpage en journées selon les horaires */
/* regroupe les clients d'une même ville à la suite (ordre des villes = 1re apparition dans le circuit) */
function groupByCity(order,city,M){const seen=[],g={};for(const k of order){const c=city[k];if(!g[c]){g[c]=[];seen.push(c)}g[c].push(k)}
  const out=[];let pos=0;
  for(const c of seen){const left=[...g[c]];while(left.length){let b=0;for(let j=1;j<left.length;j++)if(M.dur[pos][left[j]]<M.dur[pos][left[b]])b=j;pos=left.splice(b,1)[0];out.push(pos)}}
  return out}
/* découpage en journées : une ville n'est jamais coupée sur deux jours si elle tient dans une journée */
function splitDays(order,M,t,city){const S0=toMin(t.hStart),E0=toMin(t.hEnd),V=+t.visitMin||30,TOL=Math.max(0,+t.tol||0);
  const days=[];let date=firstDay(t.date,t.noSunday),pos=0,clock=S0,cur={date,from:0,stops:[],km:0,drive:0};
  const blocks=[];for(const k of order){const b=blocks[blocks.length-1];if(b&&city[b[0]]===city[k])b.push(k);else blocks.push([k])}
  const endOf=(blk,from,start)=>{let p=from,c=start;for(const k of blk){c+=M.dur[p][k]+V;p=k}return c};
  const newDay=()=>{cur.night=pos;days.push(cur);date=nextWorkDay(date,t.noSunday);cur={date,from:pos,stops:[],km:0,drive:0};clock=S0};
  const visit=k=>{const dr=M.dur[pos][k],arr=clock+dr;cur.stops.push({i:k,arr,drive:dr,km:M.dist[pos][k]});cur.km+=M.dist[pos][k];cur.drive+=dr;clock=arr+V;pos=k;if(clock>E0)cur.over=true};
  for(const blk of blocks){
    if(cur.stops.length&&endOf(blk,pos,clock)>E0+TOL&&endOf(blk,pos,S0)<=E0+TOL)newDay();
    if(endOf(blk,pos,clock)<=E0+TOL){for(const k of blk)visit(k);continue}
    for(const k of blk){if(cur.stops.length&&clock+M.dur[pos][k]+V>E0)newDay();visit(k)}}
  const back=M.dur[pos][0];cur.ret={drive:back,km:M.dist[pos][0],arr:clock+back,late:clock+back>E0};cur.km+=M.dist[pos][0];cur.drive+=back;days.push(cur);
  return days}

async function computeTrip(){const t=tripInit();
  if(!t.depart){toast('Définis d’abord le point de départ et de retour.');return}
  const cl=tripClients();if(!cl.length){toast('Aucun client sélectionné : coche au moins une ville.');return}
  if(toMin(t.hEnd)-toMin(t.hStart)<60){toast('Vérifie les horaires : la journée doit durer au moins 1 heure.');return}
  tripBusy=true;renderTrip();
  const pts=[{lat:t.depart.lat,lng:t.depart.lng},...cl.map(c=>({lat:+c.lat,lng:+c.lng}))];
  const M=await travelMatrix(pts);const raw=closedTour(M);const city=[' depart',...cl.map(cityKey)];
  const A1=splitDays(groupByCity(raw,city,M),M,t,city),A2=splitDays(groupByCity([...raw].reverse(),city,M),M,t,city);
  const score=d=>d.length*10000+d.reduce((s,x)=>s+x.drive,0);const days=score(A2)<score(A1)?A2:A1;
  const ids=[null,...cl.map(c=>c.id)];
  t.plan={est:M.est,stale:false,at:new Date().toISOString(),days:days.map(d=>({date:d.date,from:d.from===0?null:ids[d.from],night:d.night!=null?ids[d.night]:null,km:+d.km.toFixed(1),drive:Math.round(d.drive),over:!!d.over,
    stops:d.stops.map(s=>({id:ids[s.i],arr:Math.round(s.arr),drive:Math.round(s.drive),km:+s.km.toFixed(1)})),ret:d.ret?{drive:Math.round(d.ret.drive),km:+d.ret.km.toFixed(1),arr:Math.round(d.ret.arr),late:d.ret.late}:null}))};
  save();tripBusy=false;tripGeom={};renderTrip();drawTrip();fetchTripGeom();
  toast(`Itinéraire calculé : ${t.plan.days.length} jour(s), ${cl.length} visite(s)`+(M.est?' (temps estimés, serveur de routage indisponible)':''),4500)}

function dayPoints(d){const t=S.trip,dep={lat:t.depart.lat,lng:t.depart.lng};const st=d.from?byId(d.from):null;
  const pts=[st&&hasPos(st)?{lat:+st.lat,lng:+st.lng}:dep,...d.stops.map(s=>byId(s.id)).filter(hasPos).map(c=>({lat:+c.lat,lng:+c.lng}))];if(d.ret)pts.push(dep);return pts}
async function fetchTripGeom(){const p=S.trip&&S.trip.plan;if(!p)return;
  await Promise.all(p.days.map(async(d,i)=>{try{const pts=dayPoints(d);if(pts.length<2)return;const js=await osrm('route',pts.map(q=>q.lng.toFixed(6)+','+q.lat.toFixed(6)).join(';'),'overview=simplified&geometries=geojson');if(js.code==='Ok')tripGeom[i]=js.routes[0].geometry.coordinates.map(c=>[c[1],c[0]])}catch(e){}}));drawTrip()}
let tripShown=false;
function drawTrip(){tripLayer.clearLayers();$('#tripHide').hidden=!tripShown;const p=S.trip&&S.trip.plan;if(!p||!tripShown)return;const all=[];
  p.days.forEach((d,i)=>{const col=DAYCOL[i%DAYCOL.length];const pts=dayPoints(d);
    L.polyline(tripGeom[i]||pts.map(q=>[q.lat,q.lng]),{color:col,weight:tripGeom[i]?5:3,opacity:.85,dashArray:tripGeom[i]?null:'6 8'}).addTo(tripLayer);
    d.stops.forEach((s,k)=>{const c=byId(s.id);if(!hasPos(c))return;all.push([c.lat,c.lng]);
      L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="--c:${col};font-size:11px">${i+1}.${k+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:800}).bindPopup(()=>`<div class="pop-t">${esc(c.nom)}</div><div class="pop-s">Jour ${i+1} · ${esc(fmtD(d.date))} · arrivée ${fmtH(s.arr)}<br>${esc(c.ville||'')}</div><div class="pop-a"><button class="btn sm" data-act="detail" data-id="${c.id}">Fiche</button></div>`).addTo(tripLayer)})});
  const dep=S.trip.depart;L.circleMarker([dep.lat,dep.lng],{radius:9,color:'#fff',weight:3,fillColor:'#14201C',fillOpacity:1}).bindPopup('<div class="pop-t">Départ et retour</div>').addTo(tripLayer);all.push([dep.lat,dep.lng]);
  return all}

/* liens Google Maps : sur téléphone, 3 étapes intermédiaires maximum par lien -> parties de 4 arrêts */
function dayLinks(d){const t=S.trip,dep=t.depart;const st=d.from?byId(d.from):null;
  const origin=st&&hasPos(st)?{lat:+st.lat,lng:+st.lng}:{lat:dep.lat,lng:dep.lng};
  const seq=d.stops.map(s=>byId(s.id)).filter(hasPos).map(c=>({lat:+c.lat,lng:+c.lng}));if(d.ret)seq.push({lat:dep.lat,lng:dep.lng});
  if(navApp()!=='google'){const c=d.stops.map(s=>byId(s.id)).find(hasPos);return c?[{u:navTo(c.lat,c.lng),l:'1er client · '+NAV[navApp()]}]:[]}
  const links=[];let o=origin,i=0;while(i<seq.length){const part=seq.slice(i,i+4);const dest=part[part.length-1],wp=part.slice(0,-1);
    links.push(`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${dest.lat},${dest.lng}&travelmode=driving`+(wp.length?'&waypoints='+wp.map(q=>q.lat+','+q.lng).join('%7C'):''));o=dest;i+=4}
  return links.map((u,j)=>({u,l:'Naviguer'+(links.length>1?' partie '+(j+1)+'/'+links.length:'')}))}

    ${ex.length?`<p class="small muted" style="margin:10px 0 4px">Retirés (${ex.length}) :</p><div class="chipwrap">${ex.map(c=>`<button class="chip" data-act="tIn" data-id="${c.id}">↺ ${esc(c.nom)}</button>`).join('')}</div>`:''}
    <div class="btns" style="margin-top:10px"><button class="btn sm" data-act="tAddPick">+ Ajouter un client d’une autre ville</button></div></div>
  <button class="btn pri block" data-act="tCompute" ${tripBusy||!cl.length||!dep?'disabled':''}>${tripBusy?'Calcul en cours…':p?'Recalculer l’itinéraire':'Calculer l’itinéraire'}</button>`;
  if(p){const tk=p.days.reduce((s,d)=>s+d.km,0),td=p.days.reduce((s,d)=>s+d.drive,0),nv=p.days.reduce((s,d)=>s+d.stops.length,0);
    if(p.stale)h+=`<div class="banner"><span>Paramètres ou sélection modifiés depuis le calcul.</span><button class="btn sm" data-act="tCompute">Recalculer</button></div>`;
