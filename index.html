    <div class="btns"><button class="btn" data-act="tMap">Voir sur la carte</button><button class="btn pri" data-act="tSend">Envoyer dans Journée</button></div>`;
    p.days.forEach((d,i)=>{const col=DAYCOL[i%DAYCOL.length],from=d.from?byId(d.from):null,links=dayLinks(d),night=d.night?byId(d.night):null;
      h+=`<div class="day" style="--dc:${col}"><div class="day-h"><b>Jour ${i+1}</b><span>${esc(fmtDL(d.date))}</span><span class="meta num">${d.km} km · ${fmtDur(d.drive)} de route</span>${d.over?'<span class="small warn" style="flex-basis:100%">Fin de journée dépassée pour terminer la ville</span>':''}</div>
      <div class="leg start"><span class="h">${t.hStart}</span><span>Départ ${from?'de '+esc(from.ville||from.nom)+' (nuit précédente)':'de '+esc(dep.label||'ton point de départ')}</span><span></span></div>
      ${d.stops.map((s,k)=>{const c=byId(s.id)||{nom:'(client supprimé)'};return`<div class="leg"><span class="h">${fmtH(s.arr)}</span><div style="min-width:0"><div class="nm">${k+1}. ${esc(c.nom)}</div><div class="small muted">${esc([c.activite,c.ville].filter(Boolean).join(' · '))}${c.id?` · <a href="${gmDir(c)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Y aller</a>`:''}</div></div><span class="d">${fmtDur(s.drive)}<br>${s.km} km</span></div>`}).join('')}
      ${d.ret?`<div class="leg end"><span class="h">${fmtH(d.ret.arr)}</span><span>Retour ${esc(dep.label||'au point de départ')}${d.ret.late?' <span class="warn">· après ta fin de journée</span>':''}</span><span class="d">${fmtDur(d.ret.drive)}<br>${d.ret.km} km</span></div>`:night?`<div class="leg end"><span class="h">Nuit</span><span>Près de ${esc(night.nom)}${night.ville?', '+esc(night.ville):''}</span><span></span></div>`:''}
      <div class="day-f">${links.map(x=>`<a class="btn sm pri" href="${x.u}" target="_blank" rel="noopener">${x.l}</a>`).join('')}${night?`<a class="btn sm" href="https://www.google.com/maps/search/h%C3%B4tel/@${night.lat},${night.lng},14z" target="_blank" rel="noopener">Hôtels autour</a>`:''}</div></div>`})}
  $('#tripBody').innerHTML=h;
  const upd=(k,v)=>{t[k]=v;staleTrip();save()};
  $('#tDate').onchange=e=>{if(e.target.value){upd('date',e.target.value);renderTrip()}};
  $('#tVisit').onchange=e=>{upd('visitMin',Math.max(5,+e.target.value||30));renderTrip()};
  $('#tStart').onchange=e=>{if(e.target.value){upd('hStart',e.target.value);renderTrip()}};
  $('#tEnd').onchange=e=>{if(e.target.value){upd('hEnd',e.target.value);renderTrip()}};
  $('#tSun').onchange=e=>{upd('noSunday',e.target.checked);renderTrip()};
  $('#tTol').onchange=e=>{upd('tol',Math.max(0,+e.target.value||0));renderTrip()};
  $('#tdLoc').oninput=e=>{const r=parseLoc(e.target.value);if(r&&r.lat!=null){setTripDepart(r.lat,r.lng,'Point collé');renderTrip()}else if(r&&r.short)toast('Lien court sans coordonnées : ouvre-le dans Maps et copie les coordonnées.',4500)}}

function openTripPicker(){const t=tripInit(),inT=new Set(tripClients().map(c=>c.id));const list=S.clients.filter(c=>hasPos(c)&&!inT.has(c.id)).sort((a,b)=>(a.ville||'').localeCompare(b.ville||'','fr')||a.nom.localeCompare(b.nom,'fr'));
  if(!list.length){toast('Tous tes clients localisés sont déjà dans le déplacement.');return}
  openSheet(`<h2>Ajouter au déplacement</h2><input class="search" id="tpQ" type="search" placeholder="Filtrer par nom ou ville…" style="margin:10px 0"><div class="pick" id="tpList">${list.map(c=>`<label data-n="${esc(norm(c.nom+' '+c.ville))}"><input type="checkbox" value="${c.id}"><i class="dot" style="--c:${stColor(status(c))}"></i><span><b style="font-weight:600">${esc(c.nom)}</b><br><span class="small muted">${esc(c.ville||'Sans ville')}</span></span></label>`).join('')}</div><div class="btns" style="margin-top:12px"><button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn pri" data-act="tpAdd">Ajouter</button></div>`);
  $('#tpQ').addEventListener('input',e=>{const q=norm(e.target.value);for(const l of $$('#tpList label'))l.hidden=q&&!l.dataset.n.includes(q)})}
function sendTrip(){const p=S.trip.plan;const clash=p.days.filter(d=>S.tournees[d.date]&&S.tournees[d.date].ids.length);
  const go=()=>{for(const d of p.days)S.tournees[d.date]={ids:d.stops.map(s=>s.id),km:d.km,min:d.drive,est:p.est,fromStart:true,trip:true};save();dayDate=p.days[0].date;toast(p.days.length+' journée(s) ajoutée(s) au planning');show('jour')};
  if(clash.length)askConfirm('Remplacer des journées ?',clash.length+' journée(s) du déplacement ont déjà une tournée ('+clash.map(d=>fmtD(d.date)).join(', ')+'). Elles seront remplacées.','Remplacer',go,false);else go()}

const TA={
  tripOpen:()=>{tripInit();show('trip')},tripBack:()=>show('jour'),
  tdHere:()=>locate(p=>{if(p&&!p.manual){setTripDepart(p.lat,p.lng,'Ma position');renderTrip()}else toast('GPS indisponible : place le point sur la carte ou colle un lien.')},true),
  tdSaved:()=>{setTripDepart(S.settings.depart.lat,S.settings.depart.lng,'Point de départ enregistré');renderTrip()},
  tdPlace:()=>startPlacing({type:'tripDepart'},'Touche ton point de départ et de retour'),
  tCity:d=>{const t=tripInit();const i=t.cities.indexOf(d.k);if(i>=0)t.cities.splice(i,1);else t.cities.push(d.k);staleTrip();save();renderTrip()},
  tCityAll:()=>{const t=tripInit();t.cities=cityList().map(c=>c.k);staleTrip();save();renderTrip()},
  tCityNone:()=>{const t=tripInit();t.cities=[];staleTrip();save();renderTrip()},
  tEx:d=>{const t=tripInit();t.added=t.added.filter(x=>x!==d.id);if(!t.excluded.includes(d.id))t.excluded.push(d.id);staleTrip();save();renderTrip()},
  tIn:d=>{const t=tripInit();t.excluded=t.excluded.filter(x=>x!==d.id);staleTrip();save();renderTrip()},
  tAddPick:openTripPicker,
  tpAdd:()=>{const t=tripInit();const ids=$$('#tpList input:checked').map(i=>i.value);if(!ids.length){toast('Sélectionne au moins un client.');return}for(const id of ids){t.excluded=t.excluded.filter(x=>x!==id);if(!t.added.includes(id))t.added.push(id)}staleTrip();save();closeSheet();renderTrip()},
  tCompute:computeTrip,
  tMap:()=>{tripShown=true;show('carte');const pts=drawTrip();if(pts&&pts.length)map.fitBounds(pts,{padding:[40,40]});toast('Parcours affiché. Les numéros indiquent jour.ordre.',3500)},
  tSend:sendTrip,
  tHide:()=>{tripShown=false;drawTrip()}
};

/* ---------- actions ---------- */
const A={
  closeSheet:closeSheet,confirmOk:()=>{const f=confirmFn;confirmFn=null;closeSheet();f&&f()},
  locate:()=>locate(p=>{if(p){map.setView([p.lat,p.lng],15);if(cur!=='carte')toast('Position mise à jour')}else startPlacing({type:'me'},'Touche la carte pour placer ta position')}),
  cancelPlace:()=>{const p=placing;placing=null;$('#placeBanner').hidden=true;if(p&&p.type==='client')openClientForm(p.draft,p.back);if(p&&p.type==='tripDepart')show('trip')},
  toggleLegend:()=>{$('#legend').hidden=!$('#legend').hidden},
  chrSearch:chrSearch,chrClear:()=>{chrLayer.clearLayers();$('#chrClear').hidden=true;$('#chrListBtn').hidden=true},
  chrList:()=>{const L2=Object.entries(chrData).sort((a,b)=>a[1].d-b[1].d);openSheet(`<h2>${L2.length} résultat(s)</h2><p class="small muted">Triés par distance du centre de la recherche.</p><div class="hist" style="margin-top:10px">${L2.map(([id,o])=>`<div class="h" style="--c:${o.isC?'var(--ok)':'var(--prospect)'}"><div style="font-weight:600">${esc(o.nom)}</div><div class="small muted">${esc(o.act||'')} · ${o.d<1?Math.round(o.d*1000)+' m':o.d.toFixed(1)+' km'}${o.tel?' · '+esc(o.tel):''}${o.isC?' · déjà client':''}</div><div class="btns" style="margin-top:6px"><button class="btn sm" data-act="chrShow" data-id="${id}">Voir sur la carte</button><a class="btn sm pri" href="${navTo(o.lat,o.lng)}" target="_blank" rel="noopener">Itinéraire</a>${o.isC?'':`<button class="btn sm" data-act="chrAdd" data-id="${id}">+ Prospect</button>`}</div></div>`).join('')}</div>`)},
  chrShow:d=>{closeSheet();const m=chrMk[d.id];if(m){map.setView(m.getLatLng(),17);setTimeout(()=>m.openPopup(),300)}},
  chrAdd:d=>{const o=chrData[d.id];if(!o)return;map.closePopup();closeSheet();openClientForm({nom:o.nom,activite:o.act,tel:o.tel,adresse:o.adr,ville:o.ville,lat:+o.lat.toFixed(6),lng:+o.lng.toFixed(6),prospect:true,_src:'Position OpenStreetMap'})},
  detail:d=>{map.closePopup();openDetail(d.id)},visit:d=>{map.closePopup();openVisitForm(d.id)},
  newClient:()=>openClientForm({}),editClient:d=>openClientForm({...byId(d.id)}),
  showOnMap:d=>{const c=byId(d.id);closeSheet();show('carte');map.setView([c.lat,c.lng],17)},
  cfHere:()=>{setLocStat('Recherche de ta position…');locate(p=>{if(p&&!p.manual){$('#cfLat').value=+p.lat.toFixed(6);$('#cfLng').value=+p.lng.toFixed(6);setLocStat(`✓ Position GPS (±${Math.round(p.acc)} m)`,'ok')}else setLocStat('GPS indisponible ici. Utilise « Sur la carte » ou colle un lien.','warn')},true)},
  cfPlace:()=>{const f=readClientForm();startPlacing({type:'client',draft:f},'Touche l’emplacement exact du client')},
  cfSave:saveClient,
  delClient:()=>{const id=$('#sheet').dataset.cid,c=byId(id);askConfirm('Supprimer '+c.nom+' ?','Ses '+((IDX.by[id]||[]).length)+' visite(s) seront aussi supprimées.','Supprimer',()=>{S.clients=S.clients.filter(x=>x.id!==id);S.visites=S.visites.filter(v=>v.clientId!==id);for(const t of Object.values(S.tournees))t.ids=t.ids.filter(x=>x!==id);save();toast('Client supprimé');renderAll()})},
  vfRes:(d,b)=>{for(const x of $$('.results button'))x.setAttribute('aria-pressed',x===b?'true':'false');$('#sheet').dataset.res=d.k;if(d.k==='relancer'&&!$('#vfRel').value)$('#vfRel').value=addDays($('#vfDate').value||today(),7)},
  vfPlus:d=>{$('#vfRel').value=+d.n?addDays($('#vfDate').value||today(),+d.n):''},
  vfSave:saveVisit,
  delVisit:d=>{const v=S.visites.find(x=>x.id===d.id);askConfirm('Supprimer cette visite ?',fmtD(v.dt.slice(0,10))+' · '+resLabel(v.res),'Supprimer',()=>{S.visites=S.visites.filter(x=>x.id!==d.id);save();renderAll();openDetail(v.clientId)})},
  dayPrev:()=>{dayDate=addDays(dayDate,-1);renderAll()},dayNext:()=>{dayDate=addDays(dayDate,1);renderAll()},dayToday:()=>{dayDate=today();renderAll()},
  pickOpen:openPicker,pkAdd:()=>{const ids=$$('#pkList input:checked').map(i=>i.value);if(!ids.length){toast('Sélectionne au moins un client.');return}addStops(ids);closeSheet();toast(ids.length+' client(s) ajouté(s)');renderAll()},
  addStop:d=>{addStops([d.id]);if(!$('#sheetWrap').hidden)closeSheet();toast('Ajouté au '+fmtD(dayDate));renderAll()},
  addAllSugg:()=>{const t=tour(dayDate);const ids=S.clients.filter(c=>!t.ids.includes(c.id)&&['late','due'].includes(status(c,dayDate))).map(c=>c.id);addStops(ids);toast(ids.length+' client(s) ajouté(s)');renderAll()},
  planToday:d=>{dayDate=today();addStops([d.id],dayDate);toast('Ajouté à la journée d’aujourd’hui');renderAll()},
  unstop:d=>{const t=tour(dayDate);t.ids=t.ids.filter(x=>x!==d.id);t.km=null;t.min=null;delete routeGeom[dayDate];if(!t.ids.length)delete S.tournees[dayDate];save();renderAll()},
  up:d=>move(+d.i,-1),down:d=>move(+d.i,1),optimize:optimize,
  cliFilter:d=>{cliFilter=d.f;renderClients()},period:d=>{statsPeriod=d.p;renderStats()},
  exportXlsx:exportXlsx,exportPdf:exportPdf,template:templateXlsx,
  importPick:()=>{$('#fileImport').value='';$('#fileImport').click()},imGo:doImport,
  backup:()=>{downloadText('RoutePro-sauvegarde-'+stamp()+'.json',JSON.stringify(S),'application/json');toast('Sauvegarde téléchargée')},
  restorePick:()=>openSheet(`<h2>Restaurer une sauvegarde</h2><p class="small muted">Colle le texte de ta sauvegarde (il commence par {"clients"), ou choisis le fichier .json.</p><div class="form"><label class="field"><span>Texte de la sauvegarde</span><textarea id="rsText" style="min-height:140px;font:12px var(--f-mono)" placeholder='{"clients":[…'></textarea></label><div class="btns"><button class="btn" data-act="rsFile">Choisir un fichier</button><button class="btn pri" data-act="rsPaste">Restaurer le texte collé</button></div></div>`),
  rsFile:()=>{closeSheet();$('#fileRestore').value='';$('#fileRestore').click()},
  rsPaste:()=>{const t=$('#rsText').value;if(!t.trim()){toast('Colle d’abord le texte de la sauvegarde.');return}restoreFrom(t)},
  departHere:()=>locate(p=>{if(p&&!p.manual){S.settings.depart={lat:p.lat,lng:p.lng};save();renderPlus();toast('Point de départ enregistré')}else toast('GPS indisponible : place le point sur la carte.')},true),
  departPlace:()=>startPlacing({type:'depart'},'Touche ton point de départ (domicile, dépôt…)'),
  departClear:()=>{S.settings.depart=null;save();renderPlus()},
  update:()=>forceUpdate(),
  geocode:geocodeAll,clearDemo:()=>askConfirm('Effacer les exemples ?','Les clients, visites et tournées fictifs seront supprimés. Tes propres données restent.','Effacer',clearDemo),
  clearAll:()=>askConfirm('Tout effacer ?','Clients, visites et tournées seront supprimés de ce téléphone. Fais une sauvegarde avant si besoin.','Tout effacer',()=>{S=blank();S.seeded=true;save();for(const k in routeGeom)delete routeGeom[k];toast('Données effacées');renderAll()})
};
Object.assign(A,TA);
function move(i,dir){const t=tour(dayDate),j=i+dir;if(j<0||j>=t.ids.length)return;[t.ids[i],t.ids[j]]=[t.ids[j],t.ids[i]];t.km=null;t.min=null;delete routeGeom[dayDate];save();renderAll()}
function onAct(e){const tb=e.target.closest('[data-tab]');if(tb){show(tb.dataset.tab);return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e)}}
document.addEventListener('click',onAct);
/* Leaflet bloque la propagation des clics dans les popups : on écoute directement le popup ouvert */
map.on('popupopen',e=>{const el=e.popup.getElement();if(el&&!el._act){el._act=true;el.addEventListener('click',onAct)}});
$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(f)readImport(f)});
function restoreFrom(text){let d;text=String(text||'');
  if(/<html|<script|routepro_v2|function\s*\(/i.test(text)&&text.indexOf('{"clients"')<0){toast('Tu as collé le code de l’appli, pas ta sauvegarde. Retourne sur l’écran de la sauvegarde (le texte qui commence par {"clients") et touche Copier.',7000);return}
  const i=text.indexOf('{"clients"'),j=text.lastIndexOf('}');if(i>=0&&j>i)text=text.slice(i,j+1);
  try{d=JSON.parse(text.trim());if(!Array.isArray(d.clients)||!Array.isArray(d.visites))throw 0}catch(err){toast('Ce texte n’est pas une sauvegarde RoutePro valide. Copie bien tout le texte, du premier { au dernier }.',5500);return}
  askConfirm('Restaurer cette sauvegarde ?',`${d.clients.length} client(s) et ${d.visites.length} visite(s). Les données actuelles de ce téléphone seront remplacées.`,'Restaurer',()=>{S=Object.assign(blank(),d);S.seeded=true;S.settings=Object.assign(blank().settings,d.settings||{});save();fitted=false;toast('Sauvegarde restaurée : '+d.clients.length+' client(s)');show('clients')},false)}
$('#fileRestore').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f)});

/* ---------- code d'accès ---------- */
const LOCK={salt:'696f135d44779e1a28b0b9741c12e1e3',hash:'c7a3dedb141eb3c93c99f7fac4da2dea14c7361431a841c443e5de6807d8f382',iter:150000};
async function lockHash(code){const enc=new TextEncoder();const salt=new Uint8Array(LOCK.salt.match(/../g).map(h=>parseInt(h,16)));
  const k=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:LOCK.iter,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
(function(){let ok=null;try{ok=localStorage.getItem('routepro_lock')}catch(e){}
  if(ok===LOCK.hash){$('#lock').remove();return}
  $('#lockForm').addEventListener('submit',async e=>{e.preventDefault();const err=$('#lockErr');
    if(!(window.crypto&&crypto.subtle)){err.textContent="Ouvre l'appli depuis son lien https pour saisir le code.";return}
    err.textContent='Vérification…';const h=await lockHash($('#lockIn').value.trim());
    if(h===LOCK.hash){try{localStorage.setItem('routepro_lock',h)}catch(x){}$('#lock').remove();setTimeout(()=>map.invalidateSize(),50)}
    else{err.textContent='Code incorrect.';$('#lockIn').value='';$('#lockIn').focus()}})})();

/* ---------- détection des mises à jour ---------- */
async function forceUpdate(){toast('Chargement de la dernière version…',6000);try{await fetch(location.pathname,{cache:'reload'});await fetch(location.href,{cache:'reload'})}catch(e){toast('Pas de connexion : réessaie plus tard.');return}location.reload()}
async function checkUpdate(){try{const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/APP_VERSION='([^']+)'/);
  if(m&&m[1]!==APP_VERSION&&!document.getElementById('updBanner')){const b=document.createElement('div');b.id='updBanner';b.className='banner';b.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4000;background:var(--surface);box-shadow:var(--shadow)';
    b.innerHTML='<span><b>Nouvelle version disponible.</b> Tes données sont conservées.</span><button class="btn sm pri">Mettre à jour</button>';b.querySelector('button').onclick=forceUpdate;document.body.appendChild(b)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setTimeout(checkUpdate,3000);

/* ---------- démarrage ---------- */
if(!S.seeded&&!S.clients.length)seed();
buildIndex();show('carte');
locate(null,true);
</script>
